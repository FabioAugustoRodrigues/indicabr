[project]
name = "indicabr"
version = "0.1.0"
description = "Agente de IA que responde perguntas sobre indicadores econômicos do Brasil"
readme = "README.md"
authors = [
    { name = "Fabio Augusto", email = "fabio.augusto.rodrig@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.36.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]